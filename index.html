
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지점장일기 | 보험 지식과 교육</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172b4d;
      text-align: center;
    }
    header {
      background: #102b55;
      color: white;
      padding: 65px 20px;
    }
    h1 { font-size: 40px; }
    .accent { color: #f28c28; }
    main { padding: 40px 20px; }
    .card {
      background: white;
      padding: 25px;
      margin: 15px auto;
      max-width: 480px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #ddd;
    }
    footer { padding: 30px; color: #666; }
  </style>
</head>
<body>
  <header>
    <h1>지점장<span class="accent">일기</span></h1>
    <p>보험 지식과 영업 현장을 연결하다</p>
  </header>
  <main>
    <h2>보험영업 AI 교육센터</h2>
    <div class="card">
      <h3>보험 지식 자료실</h3>
      <p>보험약관과 보상 사례를 쉽게 정리합니다.</p>
    </div>
    <div class="card">
      <h3>플래너 교육센터</h3>
      <p>교육자료와 실무 FAQ를 제공합니다.</p>
    </div>
    <div class="card">
      <h3>지점장일기</h3>
      <p>보험 현장과 인생 2막의 이야기를 나눕니다.</p>
    </div>
  </main>
  <footer>현대해상 북부지점</footer>
</body>
</html>
